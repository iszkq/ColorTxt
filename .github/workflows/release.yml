name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build
        required: true
        default: v1.0.1

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            name: Windows-x64
            prune_platform: win32
            builder_target: win
            arch: x64
          - os: macos-latest
            name: macOS-arm64
            prune_platform: darwin
            builder_target: mac
            arch: arm64
          # Intel 原生构建：opencc / better-sqlite3 需 electron-rebuild 产物；
          # 在 arm64 runner 上交叉打包会打入 arm64 .node，Intel Mac 打开即崩溃。
          - os: macos-15-intel
            name: macOS-x64
            prune_platform: darwin
            builder_target: mac
            arch: x64
          - os: ubuntu-24.04-arm
            name: Linux-arm64
            prune_platform: linux
            builder_target: linux
            arch: arm64
          - os: ubuntu-latest
            name: Linux-x64
            prune_platform: linux
            builder_target: linux
            arch: x64

    env:
      # 未配置签名证书时跳过自动签名探测，避免 CI 失败
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # Linux x64 上 onnxruntime-node postinstall 会拉取 CUDA EP（约 300MB+）；内置向量仅用 CPU
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      COLORTXT_PRUNE_PLATFORM: ${{ matrix.prune_platform }}
      COLORTXT_PRUNE_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${RELEASE_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx electron-vite build

      # 按目标架构重建 Electron 原生模块（与 postinstall 宿主架构可能不同）
      - name: Rebuild native modules for target arch
        run: npx electron-rebuild -f -w better-sqlite3,opencc --arch ${{ matrix.arch }}

      - name: Prune pack dependencies
        run: node scripts/prune-pack-deps.mjs --platform ${{ matrix.prune_platform }} --arch ${{ matrix.arch }}

      - name: Log node_modules size after prune
        if: matrix.name == 'Linux-x64'
        run: |
          du -sh node_modules
          find node_modules -maxdepth 1 -name 'sqlite-vec-*' | xargs du -sh 2>/dev/null || true
          du -sh node_modules/onnxruntime-node/bin/napi-v3/* 2>/dev/null || true

      - name: Package
        run: npx electron-builder --publish never --${{ matrix.builder_target }} --${{ matrix.arch }}

      - name: Verify Linux x64 package size
        if: matrix.name == 'Linux-x64'
        shell: bash
        run: |
          appimage=(release/*.AppImage)
          size=$(stat -c%s "${appimage[0]}")
          echo "AppImage size: $(( size / 1024 / 1024 )) MB"
          if [ "$size" -gt 200000000 ]; then
            echo "Linux x64 AppImage exceeds 200 MB — prune or pack regression"
            exit 1
          fi

      - name: Remove builder debug metadata
        shell: bash
        run: rm -f release/builder-debug.yml

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - name: Import Android release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure ANDROID_KEYSTORE_BASE64 before releasing'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/colortxt.p12"
      - name: Build signed APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/colortxt.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify and name APK
        run: |
          mkdir -p output
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify "$APK"
          cp "$APK" "output/colortxt-${RELEASE_TAG#v}-android.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: release-Android
          path: mobile/output/*.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/colortxt.p12"

  ios:
    name: Build iOS unsigned IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Archive for iPhone and iPad
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ColorTxt.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' archive
      - name: Package unsigned device IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload" output
          APP="$RUNNER_TEMP/ColorTxt.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          test "v$VERSION" = "$RELEASE_TAG"
          lipo -verify_arch arm64 "$APP/App"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/mobile/output/colortxt-${RELEASE_TAG#v}-ios-unsigned.ipa" Payload)
          shasum -a 256 output/*.ipa > output/iOS-SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: release-iOS
          path: mobile/output/*
          if-no-files-found: error

  publish:
    name: Publish to GitHub Releases
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.ipa' -o \
            -name '*.blockmap' -o \
            \( -name '*.yml' ! -name 'builder-debug.yml' \) \
          \) -exec cp -t release/ {} +

      - name: Publish to GitHub Releases
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          for file in "colortxt-$VERSION-Setup.exe" "colortxt-$VERSION-Portable.exe" \
            "colortxt-$VERSION-arm64.dmg" "colortxt-$VERSION-x64.dmg" \
            "colortxt-$VERSION-arm64.AppImage" "colortxt-$VERSION-x64.AppImage" \
            "colortxt-$VERSION-android.apk" "colortxt-$VERSION-ios-unsigned.ipa"; do
            test -s "release/$file" || { echo "Missing $file"; exit 1; }
          done
          cp "docs/releases/$RELEASE_TAG.md" release/
          (cd release && sha256sum *.exe *.dmg *.AppImage *.apk *.ipa > SHA256SUMS.txt)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "彩读 $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "彩读 $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
